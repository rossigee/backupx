name: Tests & Linting

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'

      - name: Run linting
        run: make lint

      - name: Run unit tests
        run: make test-unit

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.out
          fail_ci_if_error: false

  integration:
    runs-on: ubuntu-26.04
    services:
      minio:
        image: pgsty/minio
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        options: >-
          --health-cmd "nc -zv localhost 9000 || exit 1"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
        ports:
          - 9000:9000

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'

      - name: Wait for MinIO
        run: |
          for i in {1..30}; do
            curl -f http://localhost:9000/minio/health/live && break
            sleep 1
          done

      - name: Run integration tests
        run: |
          MINIO_ENDPOINT=http://localhost:9000 \
          MINIO_USER=minioadmin \
          MINIO_PASS=minioadmin \
          make test

  build:
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        os: [linux, darwin, windows]
        arch: [amd64, arm64]
        exclude:
          - os: windows
            arch: arm64

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'

      - name: Build
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: go build -o backupx-${{ matrix.os }}-${{ matrix.arch }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: backupx-${{ matrix.os }}-${{ matrix.arch }}
          path: backupx-${{ matrix.os }}-${{ matrix.arch }}
