name: Tests & Linting

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'

      - name: Run linting
        run: make lint

      - name: Run unit tests
        run: make test-unit

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.out
          fail_ci_if_error: false

  integration:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'

      - name: Run integration tests with docker compose
        run: |
          docker compose -f docker-compose.test.yml up -d
          # Wait for MinIO to be ready
          for i in {1..30}; do
            docker compose -f docker-compose.test.yml exec -T minio curl -s http://localhost:9000/minio/health/live && break
            sleep 2
          done
          MINIO_ENDPOINT=http://localhost:9000 \
          MINIO_USER=minioadmin \
          MINIO_PASS=minioadmin \
          make test
          docker compose -f docker-compose.test.yml down

  build:
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        os: [linux, darwin, windows]
        arch: [amd64, arm64]
        exclude:
          - os: windows
            arch: arm64

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'

      - name: Build
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: go build -o backupx-${{ matrix.os }}-${{ matrix.arch }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: backupx-${{ matrix.os }}-${{ matrix.arch }}
          path: backupx-${{ matrix.os }}-${{ matrix.arch }}
